<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>공간좌표·벡터 칠판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Noto+Serif:ital,wght@1,500&display=swap">
<style>
body{margin:0}[hidden]{display:none!important}
/* Layout: 한 화면 앱 — 왼쪽 3D 무대(넓게, 프로젝터용), 오른쪽 조작·풀이 패널. 좁은 화면에선 위아래로 쌓음 */
:root{
  --bg:#e8ecf0; --panel:#ffffff; --stage:#fbfcfd; --ink:#18212b; --muted:#5f6c79;
  --line:#d5dce3; --soft:#f1f4f7; --grid:#e2e7ec; --grid2:#c8d1da;
  --ax-x:#d6312b; --ax-y:#2b8a3e; --ax-z:#1971c2;
  --c1:#e8590c; --c2:#6741d9; --c3:#0c8599; --c4:#c2255c;
  --sel-bg:#18212b; --sel-fg:#ffffff;
  --f-display:"Gowun Batang", "Nanum Myeongjo", serif;
  --f-ui:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-num:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --f-var:"Noto Serif", "Times New Roman", serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0d1218; --panel:#151c24; --stage:#10161d; --ink:#e6ebf0; --muted:#94a2af;
  --line:#28323d; --soft:#1c242e; --grid:#1b232c; --grid2:#2b3642;
  --ax-x:#ff6b6b; --ax-y:#5ad16f; --ax-z:#4dabf7;
  --c1:#ff922b; --c2:#9b7bff; --c3:#3bc9db; --c4:#f06595;
  --sel-bg:#e6ebf0; --sel-fg:#10161c; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0d1218; --panel:#151c24; --stage:#10161d; --ink:#e6ebf0; --muted:#94a2af;
  --line:#28323d; --soft:#1c242e; --grid:#1b232c; --grid2:#2b3642;
  --ax-x:#ff6b6b; --ax-y:#5ad16f; --ax-z:#4dabf7;
  --c1:#ff922b; --c2:#9b7bff; --c3:#3bc9db; --c4:#f06595;
  --sel-bg:#e6ebf0; --sel-fg:#10161c; color-scheme:dark; }

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5}
*{box-sizing:border-box}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);gap:12px;padding-inline:16px;padding-block:12px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px}
h1{font-family:var(--f-display);font-size:22px;margin:0;letter-spacing:-.01em;text-wrap:balance}
h1 small{font-family:var(--f-ui);font-weight:500;font-size:13px;color:var(--muted);margin-left:8px;letter-spacing:0}
.tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px;flex-wrap:wrap}
.tabs button{font:600 14px var(--f-ui);border:0;background:transparent;color:var(--muted);padding:7px 16px;border-radius:999px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--sel-bg);color:var(--sel-fg)}
main{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:12px;min-height:0}
.stage{position:relative;background:var(--stage);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-height:0;min-width:0}
.stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.stage canvas:active{cursor:grabbing}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;white-space:nowrap;transform:translate(9px,-50%);font:600 15px var(--f-ui);color:var(--ink);
  text-shadow:0 0 3px var(--stage),0 0 3px var(--stage),0 0 6px var(--stage)}
.lbl.ax{font:italic 500 20px var(--f-var);transform:translate(-50%,-50%)}
.lbl.tick{font:500 11px var(--f-num);color:var(--muted);transform:translate(-50%,4px)}
.lbl.foot{font:500 12px var(--f-num);color:var(--muted)}
.lbl.mid{transform:translate(-50%,-50%);font:600 14px var(--f-num)}
.lbl i{font-family:var(--f-var);font-style:italic;font-weight:500}
.overlay{position:absolute;left:12px;top:12px;display:flex;flex-wrap:wrap;gap:6px;max-width:calc(100% - 24px)}
.chip{font:500 13px var(--f-ui);border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:5px 11px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--sel-bg);color:var(--sel-fg);border-color:var(--sel-bg)}
.hint{position:absolute;right:12px;bottom:10px;font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:3px 8px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;overflow:auto;min-height:0;min-width:0;display:flex;flex-direction:column;gap:18px}
.sec{display:flex;flex-direction:column;gap:10px}
.sec h2{font:600 12px var(--f-ui);letter-spacing:.08em;color:var(--muted);margin:0;text-transform:uppercase}
.btns{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.btns.two{grid-template-columns:repeat(2,1fr)}
.btns.three{grid-template-columns:repeat(3,1fr)}
.btns button{font:600 14px var(--f-ui);padding:8px 4px;border:1px solid var(--line);border-radius:8px;background:var(--soft);color:var(--ink);cursor:pointer}
.btns button[aria-pressed="true"]{background:var(--sel-bg);color:var(--sel-fg);border-color:var(--sel-bg)}
button:focus-visible,input:focus-visible{outline:2px solid var(--c3);outline-offset:2px}
.pt{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.pt-head{display:flex;align-items:center;gap:8px;font-weight:600}
.pt-head .sw{width:12px;height:12px;border-radius:50%}
.row{display:grid;grid-template-columns:22px minmax(0,1fr) 42px;align-items:center;gap:8px}
.row label{font:italic 500 17px var(--f-var);color:var(--muted);text-align:center}
.row output{font:500 15px var(--f-num);text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--sel-bg)}
.check{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.card{background:var(--soft);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px}
.card .rule{font-weight:600}
.card .eq{font:500 17px var(--f-num);font-variant-numeric:tabular-nums;line-height:1.9;overflow-x:auto}
.card .eq.sym{font-size:15px;color:var(--muted)}
.card em{font-style:normal;color:var(--c4);font-weight:700}
.card .note{font-size:13.5px;color:var(--muted)}
.card table{border-collapse:collapse;font:500 14px var(--f-num);width:100%}
.card td{padding:3px 4px;border-bottom:1px solid var(--line)}
.card td:first-child{font-family:var(--f-ui);font-weight:600}
.v{font-family:var(--f-var);font-style:italic;font-weight:500}
.vec{position:relative;display:inline-block;font-family:var(--f-var);font-style:italic;font-weight:500;padding-top:.15em}
.vec::before{content:"\2192";position:absolute;left:50%;top:-.5em;transform:translateX(-42%);font-size:.72em;font-style:normal;line-height:1}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.15;margin:0 2px;font-size:.88em}
.fr>span:first-child{border-bottom:1.5px solid currentColor;padding:0 3px}
.rad{border-top:1.5px solid currentColor;padding:0 1px;margin-left:1px}
.c1{color:var(--c1)} .c2{color:var(--c2)} .c3{color:var(--c3)} .c4{color:var(--c4)}
.warn{color:var(--c4);font-weight:600}
.replay{align-self:flex-start;font:600 13px var(--f-ui);border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:5px 12px;cursor:pointer}
@media (max-width:880px){
  html,body{height:auto}
  .app{height:auto}
  main{grid-template-columns:minmax(0,1fr)}
  .stage{height:60vh;min-height:340px}
  .panel{overflow:visible}
  .hint{display:none}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>

</head>
<body>
<div class="app">
  <header>
    <h1>공간좌표·벡터 칠판<small>기하 · 고2</small></h1>
    <div class="tabs" role="group" aria-label="단원">
      <button id="tab-sym" data-mode="sym" aria-pressed="true">대칭이동</button>
      <button id="tab-div" data-mode="div" aria-pressed="false">거리·내분·외분</button>
      <button id="tab-vec" data-mode="vec" aria-pressed="false">벡터 연산</button>
    </div>
  </header>
  <main>
    <div class="stage" id="stage">
      <canvas id="cv"></canvas>
      <div id="labels"></div>
      <div class="overlay">
        <button class="chip" id="v-iso">기본 시점</button>
        <button class="chip" id="v-top">위에서 (xy평면)</button>
        <button class="chip" id="v-front">앞에서 (yz평면)</button>
        <button class="chip" id="v-side">옆에서 (zx평면)</button>
        <button class="chip" id="t-rot" aria-pressed="false">자동 회전</button>
        <button class="chip" id="t-tick" aria-pressed="true">눈금</button>
      </div>
      <div class="hint">드래그: 회전 · 휠/두 손가락: 확대 · 우클릭 드래그: 이동</div>
    </div>
    <aside class="panel" id="panel">
      <!-- 대칭이동 -->
      <div id="p-sym" class="sec-wrap" style="display:contents">
        <div class="sec">
          <h2>어디에 대하여 대칭이동할까요</h2>
          <div class="btns" id="symBtns"></div>
        </div>
        <div class="sec" id="symPts"><h2>점 P의 좌표</h2></div>
        <label class="check"><input type="checkbox" id="symBox" checked> 좌표 상자와 좌표평면 위의 수선의 발 보기</label>
        <div class="card" id="symOut"></div>
      </div>
      <!-- 내분·외분 -->
      <div id="p-div" hidden style="display:contents">
        <div class="sec">
          <h2>구할 점</h2>
          <div class="btns three" id="divBtns"></div>
        </div>
        <div class="sec" id="divPts"><h2>점의 좌표</h2></div>
        <div class="sec" id="divRatio"><h2>비 m : n</h2></div>
        <label class="check"><input type="checkbox" id="divBox"> 좌표 상자 보기</label>
        <div class="card" id="divOut"></div>
      </div>
      <!-- 벡터 -->
      <div id="p-vec" hidden style="display:contents">
        <div class="sec">
          <h2>벡터의 종류</h2>
          <div class="btns two" id="dimBtns"></div>
        </div>
        <div class="sec">
          <h2>연산</h2>
          <div class="btns" id="opBtns"></div>
        </div>
        <div class="sec" id="vecPts"><h2>성분</h2></div>
        <div class="card" id="vecOut"></div>
      </div>
    </aside>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
/* ---------- 상태 ---------- */
const S = {
  mode:'sym',
  P:[3,2,4], sym:null, symBox:true,
  A:[4,-2,1], B:[-1,3,4], C:[1,-3,3], m:2, n:1, div:'in', divBox:false,
  a:[3,1,2], b:[1,3,1], k:2, op:'add', dim:3,
  ticks:true, t:1
};
const L = 7; // 축 길이

/* ---------- 유틸 ---------- */
const tok = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const col = n => new THREE.Color(tok(n));
const M = (x,y,z) => new THREE.Vector3(y,z,x);           // 수학 좌표(x,y,z) → three 좌표
const Mv = p => M(p[0],p[1],p[2]);
const MINUS = '−';
function num(x){ x = Math.round(x*100)/100; if(Object.is(x,-0)) x=0; const s = String(Math.abs(x)); return (x<0?MINUS:'')+s; }
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a||1}
function frac(n,d){
  if(d<0){n=-n;d=-d}
  if(!Number.isInteger(n)||!Number.isInteger(d)) return num(n/d);
  const g=gcd(n,d); n/=g; d/=g;
  if(d===1) return num(n);
  return (n<0?MINUS:'')+`<span class="fr"><span>${Math.abs(n)}</span><span>${d}</span></span>`;
}
function surd(s){
  if(!Number.isInteger(s)) return num(Math.sqrt(s));
  if(s===0) return '0';
  let k=1; for(let i=Math.floor(Math.sqrt(s)); i>1; i--){ if(s%(i*i)===0){k=i;break;} }
  const m=s/(k*k);
  if(m===1) return String(k);
  return (k>1?k:'')+`√<span class="rad">${m}</span>`;
}
const coords = p => '('+p.map(num).join(', ')+')';
const vecHTML = n => `<span class="vec">${n}</span>`;

/* ---------- three 장면 ---------- */
const stage = document.getElementById('stage');
const cv = document.getElementById('cv');
const labelsEl = document.getElementById('labels');
const renderer = new THREE.WebGLRenderer({canvas:cv, antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40,1,0.1,500);
let controls;
scene.add(new THREE.AmbientLight(0xffffff,0.72));
const dl = new THREE.DirectionalLight(0xffffff,0.55); dl.position.set(8,14,10); scene.add(dl);
const staticG = new THREE.Group(), contentG = new THREE.Group();
scene.add(staticG, contentG);
let staticLabels = [], contentLabels = [];

function makeControls(up){
  const target = controls ? controls.target.clone() : new THREE.Vector3();
  const auto = controls ? controls.autoRotate : false;
  if(controls) controls.dispose();
  camera.up.copy(up);
  controls = new THREE.OrbitControls(camera, cv);
  controls.enableDamping = true; controls.dampingFactor = .09;
  controls.minDistance = 4; controls.maxDistance = 90;
  controls.autoRotateSpeed = 1.2; controls.autoRotate = auto;
  controls.target.copy(target);
}
function setView(v){
  const target = new THREE.Vector3();
  if(v==='top'){ camera.position.set(0,22,0); makeControls(new THREE.Vector3(1,0,0)); }
  else {
    if(v==='iso') camera.position.copy(M(13,8.5,8.5));
    if(v==='front') camera.position.copy(M(22,0,0));
    if(v==='side') camera.position.copy(M(0,22,0));
    makeControls(new THREE.Vector3(0,1,0));
  }
  controls.target.copy(target); camera.lookAt(target); controls.update();
}

function clearGroup(g){
  g.traverse(o=>{ if(o.geometry) o.geometry.dispose(); if(o.material) o.material.dispose(); });
  while(g.children.length) g.remove(g.children[0]);
}
function addLabel(list, pos, html, cls){
  const el = document.createElement('div'); el.className = 'lbl '+(cls||''); el.innerHTML = html;
  labelsEl.appendChild(el); list.push({el,pos});
}
function clearLabels(list){ list.forEach(l=>l.el.remove()); list.length=0; }

function mat(color, opacity=1){
  return new THREE.MeshLambertMaterial({color, transparent:opacity<1, opacity, depthWrite:opacity>=1});
}
function rod(g,a,b,color,r=.035,opacity=1){
  const d=b.clone().sub(a), len=d.length(); if(len<1e-6) return;
  const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,len,12), mat(color,opacity));
  m.position.copy(a).add(b).multiplyScalar(.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), d.normalize());
  g.add(m);
}
function arrow(g,a,b,color,r=.05,opacity=1){
  const d=b.clone().sub(a), len=d.length(); if(len<1e-6) return;
  const hl=Math.min(.42,len*.4), hr=r*3;
  const grp=new THREE.Group();
  const shaft=new THREE.Mesh(new THREE.CylinderGeometry(r,r,len-hl,14), mat(color,opacity));
  shaft.position.y=(len-hl)/2;
  const head=new THREE.Mesh(new THREE.ConeGeometry(hr,hl,24), mat(color,opacity));
  head.position.y=len-hl/2;
  grp.add(shaft,head); grp.position.copy(a);
  grp.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), d.normalize());
  g.add(grp);
}
function line(g,a,b,color,dashed=false,opacity=1){
  const geo=new THREE.BufferGeometry().setFromPoints([a,b]);
  const m = dashed ? new THREE.LineDashedMaterial({color,dashSize:.16,gapSize:.11,transparent:true,opacity})
                   : new THREE.LineBasicMaterial({color,transparent:true,opacity});
  const l=new THREE.Line(geo,m); if(dashed) l.computeLineDistances(); g.add(l);
}
function dot(g,p,color,r=.13){
  const m=new THREE.Mesh(new THREE.SphereGeometry(r,24,16), mat(color)); m.position.copy(p); g.add(m);
}
function fill(g,pts,color,opacity=.14){
  const geo=new THREE.BufferGeometry().setFromPoints(pts);
  const idx=[]; for(let i=1;i<pts.length-1;i++) idx.push(0,i,i+1);
  geo.setIndex(idx); geo.computeVertexNormals();
  g.add(new THREE.Mesh(geo,new THREE.MeshBasicMaterial({color,transparent:true,opacity,side:THREE.DoubleSide,depthWrite:false})));
}

/* ---------- 축·격자 ---------- */
function buildStatic(){
  clearGroup(staticG); clearLabels(staticLabels);
  renderer.setClearColor(col('--stage'));
  const grid=new THREE.GridHelper(2*L,2*L,col('--grid2'),col('--grid'));
  grid.material.transparent=true; grid.material.depthWrite=false; staticG.add(grid);
  const axes=[['x','--ax-x',p=>M(p,0,0)],['y','--ax-y',p=>M(0,p,0)],['z','--ax-z',p=>M(0,0,p)]];
  axes.forEach(([name,c,f])=>{
    const color=col(c);
    rod(staticG,f(-L),f(0),color,.018,.45);
    arrow(staticG,f(0),f(L+.2),color,.022);
    addLabel(staticLabels,f(L+.75),`<span style="color:${tok(c)}">${name}</span>`,'ax');
    for(let i=-L+1;i<L;i++){ if(i===0) continue;
      const s=new THREE.Mesh(new THREE.SphereGeometry(.045,10,8),mat(color,.8)); s.position.copy(f(i)); staticG.add(s);
      if(S.ticks && i>0) addLabel(staticLabels,f(i),String(i),'tick');
    }
  });
  addLabel(staticLabels,M(0,0,0),'<span class="v">O</span>','tick');
}

/* ---------- 강조 도형 ---------- */
function planeHL(g,which,color){
  const geo=new THREE.PlaneGeometry(2*L,2*L);
  const m=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({color,transparent:true,opacity:.16,side:THREE.DoubleSide,depthWrite:false}));
  if(which==='xy') m.rotation.x=-Math.PI/2;
  if(which==='zx') m.rotation.y=Math.PI/2;
  g.add(m);
  const e=new THREE.LineSegments(new THREE.EdgesGeometry(geo),new THREE.LineBasicMaterial({color,transparent:true,opacity:.5}));
  e.rotation.copy(m.rotation); g.add(e);
}
function coordBox(g,p,color,feetLabels){
  const [a,b,c]=p, P=Mv(p);
  const H=[[a,b,0],[0,b,c],[a,0,c]], X=[[a,0,0],[0,b,0],[0,0,c]];
  H.forEach(h=>line(g,P,Mv(h),color,true,.75));
  [[0,0],[0,1],[1,1],[1,2],[2,0],[2,2]].forEach(([hi,xi])=>line(g,Mv(H[hi]),Mv(X[xi]),color,true,.45));
  H.forEach(h=>{ if(h.some((v,i)=>v!==0||true)){ const m=new THREE.Mesh(new THREE.SphereGeometry(.07,12,10),mat(color,.7)); m.position.copy(Mv(h)); g.add(m); } });
  if(feetLabels) H.forEach(h=>addLabel(contentLabels,Mv(h),coords(h),'foot'));
}

/* ---------- 대칭이동 ---------- */
const SYM = {
  xy:{name:'xy평면',kind:'plane',f:([a,b,c])=>[a,b,-c],flip:[0,0,1],rule:'<b>z좌표</b>의 부호만 바뀝니다.'},
  yz:{name:'yz평면',kind:'plane',f:([a,b,c])=>[-a,b,c],flip:[1,0,0],rule:'<b>x좌표</b>의 부호만 바뀝니다.'},
  zx:{name:'zx평면',kind:'plane',f:([a,b,c])=>[a,-b,c],flip:[0,1,0],rule:'<b>y좌표</b>의 부호만 바뀝니다.'},
  x:{name:'x축',kind:'axis',f:([a,b,c])=>[a,-b,-c],flip:[0,1,1],rule:'<b>x좌표는 그대로</b>, 나머지 두 좌표의 부호가 바뀝니다.'},
  y:{name:'y축',kind:'axis',f:([a,b,c])=>[-a,b,-c],flip:[1,0,1],rule:'<b>y좌표는 그대로</b>, 나머지 두 좌표의 부호가 바뀝니다.'},

const ease = t => 1-Math.pow(1-t,3);

function buildSym(){
  const g=contentG, P=S.P, PP=Mv(P), c1=col('--c1'), c2=col('--c2'), c4=col('--c4');
  dot(g,PP,c1,.15);
  addLabel(contentLabels,PP,`<span class="c1"><i>P</i>${coords(P)}</span>`);
  if(S.symBox) coordBox(g,P,c1,S.sym!=='all');
  const keys = !S.sym ? [] : S.sym==='all' ? Object.keys(SYM) : [S.sym];
  keys.forEach(key=>{
    const s=SYM[key], Q=s.f(P), QQ=Mv(Q);
    const cur=PP.clone().lerp(QQ,S.t);
    if(S.sym!=='all'){
      if(s.kind==='plane') planeHL(g,key,c2);
      if(s.kind==='axis'){ const f={x:p=>M(p,0,0),y:p=>M(0,p,0),z:p=>M(0,0,p)}[key]; rod(g,f(-L),f(L),c2,.07,.35); }
      if(s.kind==='origin'){ const m=new THREE.Mesh(new THREE.SphereGeometry(.24,24,16),mat(c2,.35)); g.add(m); }
    }
    line(g,PP,cur,c2,true,.9);
    const mid=P.map((v,i)=>(v+Q[i])/2), MM=Mv(mid);
    if(S.t>.5 && PP.distanceTo(QQ)>1e-6){
      const m=new THREE.Mesh(new THREE.SphereGeometry(.08,14,10),mat(c4)); m.position.copy(MM); g.add(m);
      if(S.sym!=='all') addLabel(contentLabels,MM,`<span class="c4"><i>M</i></span>`);
    }
    dot(g,cur,c2,.15);
    if(S.t>=1){
      const txt = S.sym==='all' ? `<span class="c2">${s.name} ${coords(Q)}</span>` : `<span class="c2"><i>P′</i>${coords(Q)}</span>`;
      addLabel(contentLabels,QQ,txt);
    }
  });
}

  out.innerHTML = `<div class="rule">${s.name}에 대한 대칭이동: ${s.rule}</div>

    <button class="replay" id="replay">다시 보기 ▶</button>`;
  document.getElementById('replay').onclick=play;
}

/* ---------- 거리·내분·외분 ---------- */
function divPoint(){
  const {A,B,C,m,n}=S;
  if(S.div==='in') return A.map((v,i)=>(m*B[i]+n*v)/(m+n));
  if(S.div==='ex') return m===n?null:A.map((v,i)=>(m*B[i]-n*v)/(m-n));
  return A.map((v,i)=>(v+B[i]+C[i])/3);
}
function buildDiv(){
  const g=contentG, {A,B,C}=S, a=Mv(A), b=Mv(B), c=Mv(C);
  const c1=col('--c1'),c2=col('--c2'),c3=col('--c3'),c4=col('--c4'),ink=col('--muted');
  dot(g,a,c1); dot(g,b,c2);
  addLabel(contentLabels,a,`<span class="c1"><i>A</i>${coords(A)}</span>`);
  addLabel(contentLabels,b,`<span class="c2"><i>B</i>${coords(B)}</span>`);
  if(S.divBox){ coordBox(g,A,c1,false); coordBox(g,B,c2,false); if(S.div==='cen') coordBox(g,C,c3,false); }
  const P=divPoint();
  if(S.div==='cen'){
    dot(g,c,c3); addLabel(contentLabels,c,`<span class="c3"><i>C</i>${coords(C)}</span>`);
    fill(g,[a,b,c],c3,.12);
    rod(g,a,b,ink,.03); rod(g,b,c,ink,.03); rod(g,c,a,ink,.03);
    [[a,b,c],[b,c,a],[c,a,b]].forEach(([v,p,q])=>{ const mid=p.clone().add(q).multiplyScalar(.5); line(g,v,mid,c4,true,.8); const s=new THREE.Mesh(new THREE.SphereGeometry(.06,10,8),mat(c4,.7)); s.position.copy(mid); g.add(s); });
    const G=Mv(P); dot(g,G,c4,.15); addLabel(contentLabels,G,`<span class="c4"><i>G</i>${coords(P)}</span>`);
    return;
  }
  if(!P){ rod(g,a,b,ink,.03); return; }
  const p=Mv(P);
  if(S.div==='in'){
    rod(g,a,p,c1,.045); rod(g,p,b,c2,.045);
    addLabel(contentLabels,a.clone().lerp(p,.5),`<span class="c1">${S.m}</span>`,'mid');
    addLabel(contentLabels,p.clone().lerp(b,.5),`<span class="c2">${S.n}</span>`,'mid');
  } else {
    // 직선 AB를 P 너머까지 연장
    const far=[a,b,p], dir=b.clone().sub(a).normalize();
    let tmin=Infinity,tmax=-Infinity; far.forEach(v=>{const t=v.clone().sub(a).dot(dir); tmin=Math.min(tmin,t); tmax=Math.max(tmax,t);});
    line(g,a.clone().addScaledVector(dir,tmin-1),a.clone().addScaledVector(dir,tmax+1),ink,true,.7);
    rod(g,a,b,ink,.03);
    rod(g,a,p,c1,.04,.55); rod(g,b,p,c2,.07,.4);
    addLabel(contentLabels,a.clone().lerp(p,.5),`<span class="c1">AP = ${S.m}k</span>`,'mid');
    addLabel(contentLabels,b.clone().lerp(p,.5),`<span class="c2">BP = ${S.n}k</span>`,'mid');
  }
  dot(g,p,c4,.15);
  addLabel(contentLabels,p,`<span class="c4"><i>P</i>${coords(P)}</span>`);
}
function divPanel(){
  const {A,B,C,m,n}=S, out=document.getElementById('divOut');

  const d2=A.reduce((s,v,i)=>s+(B[i]-v)**2,0);

  let html=`<div class="rule">두 점 사이의 거리</div>

  if(S.div==='in'){
    const P=divPoint();
    html+=`<div class="rule">선분 AB를 <span class="c1">${m}</span> : <span class="c2">${n}</span>로 내분하는 점</div>

    else html+=`<div class="rule">선분 AB를 <span class="c1">${m}</span> : <span class="c2">${n}</span>로 외분하는 점</div>

      <div class="eq">P(${A.map((v,i)=>frac(m*B[i]-n*v,m-n)).join(', ')})</div>
      <div class="note">${m>n?'m > n이므로 P는 B 쪽 연장선 위에':'m < n이므로 P는 A 쪽 연장선 위에'} 있습니다. AP : BP = ${m} : ${n}</div>`;
  } else {
    html+=`<div class="rule">삼각형 ABC의 무게중심</div>
      <div class="eq sym">G( <span class="fr"><span>x₁+x₂+x₃</span><span>3</span></span>, <span class="fr"><span>y₁+y₂+y₃</span><span>3</span></span>, <span class="fr"><span>z₁+z₂+z₃</span><span>3</span></span> )</div>
      <div class="eq">G(${A.map((v,i)=>frac(v+B[i]+C[i],3)).join(', ')})</div>
      <div class="note">점선은 세 중선입니다. 무게중심은 각 중선을 꼭짓점에서부터 2 : 1로 내분합니다.</div>`;
  }
  out.innerHTML=html;

/* ---------- 벡터 ---------- */
const add=(u,v)=>u.map((x,i)=>x+v[i]), sub=(u,v)=>u.map((x,i)=>x-v[i]), mul=(k,u)=>u.map(x=>k*x);
const dotp=(u,v)=>u.reduce((s,x,i)=>s+x*v[i],0), norm2=u=>dotp(u,u);
const vc = p => S.dim===2 ? '('+p.slice(0,2).map(num).join(', ')+')' : coords(p);
function buildVec(){
  const g=contentG, a=S.a, b=S.b, O=new THREE.Vector3();
  const c1=col('--c1'),c2=col('--c2'),c4=col('--c4'),mu=col('--muted');
  const A=Mv(a), B=Mv(b);
  const lab=(p,h)=>addLabel(contentLabels,p,h);
  if(S.op==='add'){
    const s=add(a,b), SS=Mv(s);
    fill(g,[O,A,SS,B],c4,.1);
    arrow(g,A,SS,c2,.035,.4); arrow(g,B,SS,c1,.035,.4);
    arrow(g,O,A,c1); arrow(g,O,B,c2); arrow(g,O,SS,c4,.06);
    lab(A.clone().multiplyScalar(.55),`<span class="c1">${vecHTML('a')}</span>`);
    lab(B.clone().multiplyScalar(.55),`<span class="c2">${vecHTML('b')}</span>`);
    lab(SS,`<span class="c4">${vecHTML('a')}+${vecHTML('b')} = ${vc(s)}</span>`);
  } else if(S.op==='sub'){
    const s=sub(a,b), SS=Mv(s);
    arrow(g,O,A,c1); arrow(g,O,B,c2);
    arrow(g,B,A,c4,.05,.55);
    fill(g,[O,B,A,SS],c4,.08);
    line(g,A,SS,mu,true,.6);
    arrow(g,O,SS,c4,.06);
    lab(A,`<span class="c1">${vecHTML('a')}</span>`);
    lab(B,`<span class="c2">${vecHTML('b')}</span>`);
    lab(B.clone().lerp(A,.5),`<span class="c4">${vecHTML('a')}${MINUS}${vecHTML('b')}</span>`);
    lab(SS,`<span class="c4">${vecHTML('a')}${MINUS}${vecHTML('b')} = ${vc(s)}</span>`);
  } else if(S.op==='scale'){
    const s=mul(S.k,a), SS=Mv(s);
    const ext=Math.max(norm2(a)>0?1:0,1);
    if(norm2(a)>0){ const d=A.clone().normalize(); line(g,d.clone().multiplyScalar(-L*1.3),d.clone().multiplyScalar(L*1.3),mu,true,.45*ext); }
    arrow(g,O,SS,c4,.1,.45);
    arrow(g,O,A,c1,.05);
    lab(A,`<span class="c1">${vecHTML('a')}</span>`);
    lab(SS,`<span class="c4">${num(S.k)}${vecHTML('a')} = ${vc(s)}</span>`);
  } else {
    arrow(g,O,A,c1); arrow(g,O,B,c2);
    lab(A,`<span class="c1">${vecHTML('a')}</span>`); lab(B,`<span class="c2">${vecHTML('b')}</span>`);
    const na=Math.sqrt(norm2(a)), nb=Math.sqrt(norm2(b));
    if(na>0&&nb>0){
      const ua=A.clone().normalize(), ub=B.clone().normalize();
      const th=Math.acos(Math.max(-1,Math.min(1,ua.dot(ub))));
      const r=Math.min(1.1,na*.5,nb*.5);
      if(th>1e-3 && Math.PI-th>1e-3){
        const pts=[]; for(let i=0;i<=32;i++){ const t=i/32; const v=ua.clone().multiplyScalar(Math.sin((1-t)*th)).add(ub.clone().multiplyScalar(Math.sin(t*th))).divideScalar(Math.sin(th)).multiplyScalar(r); pts.push(v); }
        g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:c4})));
        fill(g,[O,...pts],c4,.18);
        const midv=ua.clone().add(ub).normalize().multiplyScalar(r+.35);
        addLabel(contentLabels,midv,`<span class="c4"><i>θ</i></span>`,'mid');
      }
      // b의 a 위로의 정사영
      const k=dotp(a,b)/norm2(a), Q=A.clone().multiplyScalar(k);
      if(Math.abs(k*na)>1e-6) rod(g,O,Q,c2,.09,.3);
      line(g,B,Q,mu,true,.9);
      const w=B.clone().sub(Q);
      if(w.length()>1e-3){ w.normalize(); const u=ua.clone().multiplyScalar(k>0?-1:1), s=.22;
        const p1=Q.clone().addScaledVector(w,s), p2=p1.clone().addScaledVector(u,s), p3=Q.clone().addScaledVector(u,s);
        line(g,p1,p2,mu); line(g,p2,p3,mu); }
    }
  }
}

    h+=`<div class="rule">실수배는 모든 성분에 ${num(k)}을(를) 곱합니다</div>
      <div class="eq">${num(k)}${vecHTML('a')} = <em>${comp(s)}</em></div>
      <div class="eq">|${num(k)}${vecHTML('a')}| = |${num(k)}|·|${vecHTML('a')}| = ${num(Math.abs(k))}×${surd(n2)}${Number.isInteger(n2)?'':''}</div>
      <div class="note">${k>0?'k > 0이면 같은 방향':k<0?'k < 0이면 반대 방향':'k = 0이면 영벡터'}입니다. 실수배한 벡터는 언제나 ${vecHTML('a')}와 평행한 점선 위에 있습니다.</div>`;
  } else {
    const dp=dotp(a,b), na2=norm2(a), nb2=norm2(b);
    h+=`<div class="rule">내적과 두 벡터가 이루는 각</div>
      <div class="eq">${vecHTML('a')}·${vecHTML('b')} = ${idx.map(i=>`${num(a[i])}·${b[i]<0?'('+num(b[i])+')':num(b[i])}`).join(' + ')} = <em>${num(dp)}</em></div>
      <div class="eq">|${vecHTML('a')}| = ${surd(na2)}, |${vecHTML('b')}| = ${surd(nb2)}</div>`;
    if(na2===0||nb2===0) h+=`<div class="warn">영벡터가 있으면 각을 정할 수 없습니다.</div>`;
    else {
      const cos=dp/Math.sqrt(na2*nb2), th=Math.acos(Math.max(-1,Math.min(1,cos)))*180/Math.PI;
      h+=`<div class="eq">cos <span class="v">θ</span> = <span class="fr"><span>${vecHTML('a')}·${vecHTML('b')}</span><span>|${vecHTML('a')}||${vecHTML('b')}|</span></span> = <span class="fr"><span>${num(dp)}</span><span>${surd(na2*nb2)}</span></span> ≈ ${num(cos)}</div>
        <div class="eq"><span class="v">θ</span> ≈ <em>${num(Math.round(th*10)/10)}°</em></div>
        <div class="note">${dp===0?'내적이 0이므로 두 벡터는 <b>수직</b>입니다.':dp>0?'내적 > 0 → 예각':'내적 < 0 → 둔각'}. 보라색 굵은 부분은 ${vecHTML('b')}를 ${vecHTML('a')} 위로 정사영한 것으로, 그 길이 × |${vecHTML('a')}| = |${vecHTML('a')}·${vecHTML('b')}|입니다.</div>`;
    }
  }
  out.innerHTML=h;
}

const refreshers=[];
function sliders(parent,key,title,cls,names,min,max,step,isScalar,rowCls){

    row.innerHTML=`<label for="${id}">${nm}</label><input type="range" id="${id}" min="${min}" max="${max}" step="${step}"><output></output>`;
    const inp=row.querySelector('input'), o=row.querySelector('output');
    const get=()=>isScalar?S[key]:S[key][i];
    const set=v=>{ if(isScalar) S[key]=v; else S[key][i]=v; };
    const sync=()=>{ inp.value=get(); o.textContent=num(get()); };
    inp.addEventListener('input',()=>{ set(parseFloat(inp.value)); o.textContent=num(get()); update(); });
    refreshers.push(sync); sync();
    wrap.appendChild(row);
  });
  parent.appendChild(wrap);
}
function btnGroup(id,items,key,after){
  const el=document.getElementById(id);
  items.forEach(([val,label])=>{
    const b=document.createElement('button'); b.innerHTML=label; b.dataset.val=val; b.id=`${id}-${val}`;
    b.onclick=()=>{ if(key==='sym' && S.sym===val){ S.sym=null; syncBtns(); update(); return; } S[key]= typeof S[key]==='number'?Number(val):val; after&&after(); syncBtns(); update(); if(key==='sym') play(); };
    el.appendChild(b);
  });
}
function syncBtns(){
  [['symBtns','sym'],['divBtns','div'],['opBtns','op'],['dimBtns','dim']].forEach(([id,key])=>{
    document.querySelectorAll(`#${id} button`).forEach(b=>b.setAttribute('aria-pressed',String(String(S[key])===b.dataset.val)));
  });
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===S.mode)));
}
btnGroup('symBtns',[['xy','xy평면'],['yz','yz평면'],['zx','zx평면'],['o','원점'],['x','x축'],['y','y축'],['z','z축'],['all','7개 모두']],'sym');
sliders(document.getElementById('symPts'),'P','점 P','--c1',['x','y','z'],-5,5,1);
btnGroup('divBtns',[['in','내분점'],['ex','외분점'],['cen','무게중심']],'div');
const dp=document.getElementById('divPts');
sliders(dp,'A','점 A (x₁, y₁, z₁)','--c1',['x','y','z'],-5,5,1);
sliders(dp,'B','점 B (x₂, y₂, z₂)','--c2',['x','y','z'],-5,5,1);
sliders(dp,'C','점 C (x₃, y₃, z₃)','--c3',['x','y','z'],-5,5,1);
const dr=document.getElementById('divRatio');
sliders(dr,'m','m','--c1',['m'],1,5,1,true);
sliders(dr,'n','n','--c2',['n'],1,5,1,true);
btnGroup('dimBtns',[['2','평면벡터'],['3','공간벡터']],'dim',()=>{
  if(S.dim===2){ S.a[2]=0; S.b[2]=0; setView('top'); } else { setView('iso'); }
  refreshers.forEach(f=>f());
});
btnGroup('opBtns',[['add',`${vecHTML('a')}+${vecHTML('b')}`],['sub',`${vecHTML('a')}${MINUS}${vecHTML('b')}`],['scale',`<span class="v">k</span>${vecHTML('a')}`],['dot','내적']],'op');
const vp=document.getElementById('vecPts');
sliders(vp,'a','벡터 a','--c1',['x','y','z'],-4,4,1,false,'zrow');
sliders(vp,'b','벡터 b','--c2',['x','y','z'],-4,4,1,false,'zrow');
sliders(vp,'k','실수 k','--c4',['k'],-2,2,.5,true);
// 벡터 패널의 제목에 화살표 기호 적용
document.querySelector('#pt-a .pt-head').lastChild.replaceWith(Object.assign(document.createElement('span'),{innerHTML:'벡터 '+vecHTML('a')}));
document.querySelector('#pt-b .pt-head').lastChild.replaceWith(Object.assign(document.createElement('span'),{innerHTML:'벡터 '+vecHTML('b')}));

document.getElementById('symBox').onchange=e=>{S.symBox=e.target.checked; update();};
document.getElementById('divBox').onchange=e=>{S.divBox=e.target.checked; update();};
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  S.mode=b.dataset.mode;
  ['sym','div','vec'].forEach(m=>document.getElementById('p-'+m).hidden = m!==S.mode);
  if(S.mode==='vec' && S.dim===2) setView('top');
  syncBtns(); update(); if(S.mode==='sym') play();
});
document.getElementById('v-iso').onclick=()=>setView('iso');
document.getElementById('v-top').onclick=()=>setView('top');
document.getElementById('v-front').onclick=()=>setView('front');
document.getElementById('v-side').onclick=()=>setView('side');
document.getElementById('t-rot').onclick=e=>{ controls.autoRotate=!controls.autoRotate; e.target.setAttribute('aria-pressed',String(controls.autoRotate)); };
document.getElementById('t-tick').onclick=e=>{ S.ticks=!S.ticks; e.target.setAttribute('aria-pressed',String(S.ticks)); buildStatic(); };

/* ---------- 갱신·애니메이션 ---------- */
function buildContent(){
  clearGroup(contentG); clearLabels(contentLabels);
  if(S.mode==='sym') buildSym(); else if(S.mode==='div') buildDiv(); else buildVec();
}
function update(){
  buildContent();
  if(S.mode==='sym') symPanel(); else if(S.mode==='div') divPanel(); else vecPanel();
}
let anim=null;
const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function play(){ if(reduce||!S.sym){S.t=1; update(); return;} S.t=0; anim={start:performance.now(),dur:1100}; update(); }

function resize(){
  const w=stage.clientWidth, h=stage.clientHeight;
  renderer.setSize(w,h,false); camera.aspect=w/Math.max(h,1); camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);

const tmp=new THREE.Vector3();
function placeLabels(){
  const w=stage.clientWidth,h=stage.clientHeight;
  for(const l of staticLabels.concat(contentLabels)){
    tmp.copy(l.pos).project(camera);
    if(tmp.z>1||tmp.z<-1){ l.el.hidden=true; continue; }
    l.el.hidden=false;
    l.el.style.left=((tmp.x+1)/2*w)+'px'; l.el.style.top=((1-tmp.y)/2*h)+'px';
  }
}
function loop(now){
  if(anim){
    const t=Math.min(1,(now-anim.start)/anim.dur); S.t=ease(t);
    buildContent(); if(t>=1) anim=null;
  }
  controls.update(); renderer.render(scene,camera); placeLabels();
  requestAnimationFrame(loop);
}

function themeChanged(){ buildStatic(); buildContent(); }
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',themeChanged);
new MutationObserver(themeChanged).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

setView('iso'); resize(); buildStatic(); syncBtns(); update(); play();
requestAnimationFrame(loop);
})();
</script>
